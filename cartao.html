<button id="btn">Abana para fazer nevar</button>
<script>
// Geometria da imagem (1400x1814): globo
const IW=1400,IH=1814,GX=704,GY=800,GR=440,FLOOR=1085;
const stage=document.getElementById('stage'),cv=document.getElementById('c'),ctx=cv.getContext('2d');
let S=1,dpr=Math.min(devicePixelRatio||1,2);
function resize(){
  const w=Math.min(innerWidth,innerHeight*IW/IH);
  stage.style.width=w+'px';stage.style.height=(w*IH/IW)+'px';
  S=w/IW;cv.width=w*dpr;cv.height=w*IH/IW*dpr;
}
addEventListener('resize',resize);resize();

const N=170,fl=[];
const rnd=(a,b)=>a+Math.random()*(b-a);
for(let i=0;i<N;i++){
  const a=rnd(0,6.283),r=Math.sqrt(Math.random())*GR*0.85;
  fl.push({x:GX+Math.cos(a)*r,y:GY+Math.sin(a)*r*0.8,vx:0,vy:0,
    z:rnd(0.5,1),p:rnd(0,6.28)});          // z: profundidade (tamanho/opacidade)
}
let gx=0,gy=1;
function stir(p){for(const f of fl){f.vx+=rnd(-1,1)*p*14;f.vy+=rnd(-1.3,0.3)*p*14;}}
setTimeout(()=>stir(0.35),400);            // pequena nevada ao abrir

let lx=0,ly=0,lz=0;
function onMotion(e){
  const a=e.accelerationIncludingGravity;if(!a)return;
  const m=Math.abs(a.x-lx)+Math.abs(a.y-ly)+Math.abs(a.z-lz);lx=a.x;ly=a.y;lz=a.z;
  if(m>7)stir(Math.min(m/14,1));
}
function onOrient(e){
  if(e.gamma==null)return;
  gx=Math.max(-1,Math.min(1,e.gamma/45))*0.5;
}
const btn=document.getElementById('btn');
btn.onclick=async()=>{
  try{
    if(typeof DeviceMotionEvent!=='undefined'&&DeviceMotionEvent.requestPermission){
      if(await DeviceMotionEvent.requestPermission()!=='granted')return;
    }
    addEventListener('devicemotion',onMotion);addEventListener('deviceorientation',onOrient);
    btn.style.display='none';
  }catch(e){btn.textContent='Toca ou arrasta no globo'}
};
// Android: sem permissão explícita
if(typeof DeviceMotionEvent!=='undefined'&&!DeviceMotionEvent.requestPermission){
  addEventListener('devicemotion',onMotion);addEventListener('deviceorientation',onOrient);
}
// toque / rato
let px=null,py=null;
stage.addEventListener('pointerdown',e=>{px=e.clientX;py=e.clientY;stir(0.15)});
stage.addEventListener('pointermove',e=>{if(px===null)return;const d=Math.hypot(e.clientX-px,e.clientY-py);px=e.clientX;py=e.clientY;if(d>3)stir(Math.min(d/60,0.5))});
addEventListener('pointerup',()=>px=null);

function draw(t){
  ctx.setTransform(dpr*S,0,0,dpr*S,0,0);
  ctx.clearRect(0,0,IW,IH);
  ctx.save();ctx.beginPath();ctx.arc(GX,GY,GR,0,6.283);ctx.clip();
  for(const f of fl){
    f.vy+=0.07*gy*f.z;f.vx+=0.07*gx*f.z;
    f.vx*=0.985;f.vy*=0.985;
    if(f.vy>1.3*f.z)f.vy=1.3*f.z;
    f.x+=f.vx+Math.sin(t/800+f.p)*0.3;f.y+=f.vy;
    const dx=f.x-GX,dy=f.y-GY,d=Math.hypot(dx,dy),lim=GR*0.96;
    if(d>lim){f.x=GX+dx/d*lim;f.y=GY+dy/d*lim;f.vx*=-0.3;f.vy*=-0.3;}
    const fy=FLOOR+Math.sin(f.x*0.02)*6+f.z*14;     // monte de neve
    if(f.y>fy){f.y=fy;f.vy=0;f.vx*=0.7;}
    const r=2.2+f.z*3.2;
    const g=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,r);
    g.addColorStop(0,'rgba(255,255,255,'+(0.55+0.4*f.z)+')');g.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(f.x,f.y,r,0,6.283);ctx.fill();
  }
  ctx.restore();
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
