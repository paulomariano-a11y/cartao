/10WqQbioAB4Mu/0r5KqjK9BEnh5eFfcZAHOHM+gAnBB8log95/+5ex4i1IJ1ojGoqr8BCN5UEkezO3y+vd1huAn2z5zfHkUHb8vyQe7rrNcVETpbPfBNkX2HMSTdDN1tyvT3RbsSy75nqnD4VFEyuuz8oH1UFDQz3yx7BOYaQa9HkHH+rxoqzUrn+AgiHFrNqEr6yRsYAUlCtP7bTa2IRhjVxNqxlIkrsp94gxIMQFl8h0OcU3ds+O4R3z7OpTAEIXMmD0qTvBwsw9/U01DRhqRtMTBiA0stK7PE9Y/1DGzgXuzpVgT5ALIWHJxa96Y8ccC73/dvpqWtZ4UiG4VdputfqfMv4wrEfJRD53mK0wOVgl0r0+MtafMq61YCCxodzsVgZH8aD8gaQAA="><canvas id="c"></canvas></div>
<button id="btn">Abana para fazer nevar</button>
<script>
// Geometria da imagem (1400x1814): globo
const IW=1100,IH=1280,GX=550,GY=528,GR=435,FLOOR=805;
const TOP="rgb(48,60,115)",BOT="rgb(69,81,136)";
const stage=document.getElementById('stage'),cv=document.getElementById('c'),ctx=cv.getContext('2d');
let S=1,dpr=Math.min(devicePixelRatio||1,2);
function resize(){
  const w=Math.min(innerWidth,innerHeight*IW/IH);
  stage.style.width=w+'px';stage.style.height=(w*IH/IW)+'px';
  S=w/IW;const h=w*IH/IW,y0=(innerHeight-h)/2;document.body.style.background='linear-gradient('+TOP+' '+y0+'px,'+BOT+' '+(y0+h)+'px)';cv.width=w*dpr;cv.height=w*IH/IW*dpr;
}
addEventListener('resize',resize);resize();

const N=380,fl=[];
const rnd=(a,b)=>a+Math.random()*(b-a);
for(let i=0;i<N;i++){
  const a=rnd(0,6.283),r=Math.sqrt(Math.random())*GR*0.85;
  fl.push({x:GX+Math.cos(a)*r,y:GY+Math.sin(a)*r*0.8,vx:0,vy:0,
    z:rnd(0.4,1),p:rnd(0,6.28)});          // z: profundidade (tamanho/opacidade)
}
let gx=0,gy=1;
function stir(p){for(const f of fl){f.vx+=rnd(-1,1)*p*5;f.vy+=rnd(-1.2,0.2)*p*5;}}
setTimeout(()=>stir(0.5),400);            // pequena nevada ao abrir

let lx=0,ly=0,lz=0;
function onMotion(e){
  const a=e.accelerationIncludingGravity;if(!a)return;
  const m=Math.abs(a.x-lx)+Math.abs(a.y-ly)+Math.abs(a.z-lz);lx=a.x;ly=a.y;lz=a.z;
  if(m>14)stir(Math.min(m/30,0.8));
}
function onOrient(e){
  if(e.gamma==null)return;
  gx=Math.max(-1,Math.min(1,e.gamma/45))*0.25;
}
const btn=document.getElementById('btn');
btn.onclick=async()=>{
  try{
    if(typeof DeviceMotionEvent!=='undefined'&&DeviceMotionEvent.requestPermission){
      if(await DeviceMotionEvent.requestPermission()!=='granted')return;
    }
    addEventListener('devicemotion',onMotion);addEventListener('deviceorientation',onOrient);
    btn.style.display='none';
  }catch(e){btn.textContent='Toca ou arrasta no globo'}
};
// Android: sem permissão explícita
if(typeof DeviceMotionEvent!=='undefined'&&!DeviceMotionEvent.requestPermission){
  addEventListener('devicemotion',onMotion);addEventListener('deviceorientation',onOrient);
}
// toque / rato
let px=null,py=null;
stage.addEventListener('pointerdown',e=>{px=e.clientX;py=e.clientY;stir(0.15)});
stage.addEventListener('pointermove',e=>{if(px===null)return;const d=Math.hypot(e.clientX-px,e.clientY-py);px=e.clientX;py=e.clientY;if(d>3)stir(Math.min(d/60,0.5))});
addEventListener('pointerup',()=>px=null);

const spr=document.createElement('canvas');spr.width=spr.height=32;
(function(){const c=spr.getContext('2d'),g=c.createRadialGradient(16,16,0,16,16,16);
g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=g;c.fillRect(0,0,32,32)})();
function draw(t){
  ctx.setTransform(dpr*S,0,0,dpr*S,0,0);
  ctx.clearRect(0,0,IW,IH);
  ctx.save();ctx.beginPath();ctx.arc(GX,GY,GR,0,6.283);ctx.clip();
  for(const f of fl){
    f.vy+=0.07*gy*f.z;f.vx+=0.07*gx*f.z;
    f.vx*=0.975;f.vy*=0.975;
    if(f.vy>0.9*f.z)f.vy=0.9*f.z;
    f.x+=f.vx+Math.sin(t/800+f.p)*0.3;f.y+=f.vy;
    const dx=f.x-GX,dy=f.y-GY,d=Math.hypot(dx,dy),lim=GR*0.96;
    if(d>lim){f.x=GX+dx/d*lim;f.y=GY+dy/d*lim;f.vx*=-0.3;f.vy*=-0.3;}
    const fy=FLOOR+Math.sin(f.x*0.02)*6+f.z*14;     // monte de neve
    if(f.y>fy){f.y=fy;f.vy=0;f.vx*=0.7;}
    const r=1.5+f.z*2.3;
    ctx.globalAlpha=0.55+0.4*f.z;ctx.drawImage(spr,f.x-r,f.y-r,r*2,r*2);
  }
  ctx.globalAlpha=1;
  ctx.restore();
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
